<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bahia Mala — 2 décisions</title>
<style>
:root{--pap:#f1efe9;--enc:#1b2235;--dou:#6b7183;--fil:#e0dbd0;--nav:#1d2a4a;
  --ok:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--pap);color:var(--enc);
  font:400 17px/1.6 Georgia,'Times New Roman',serif;
  padding:22px max(16px,env(safe-area-inset-left)) 40px}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--fil);
  border-radius:12px;padding:26px 22px 28px}
.mq{font:700 21px/1.2 Helvetica,Arial,sans-serif;letter-spacing:.14em;
  color:var(--nav);margin:0 0 4px}
.sub{margin:0 0 18px;padding-bottom:16px;border-bottom:2px solid var(--enc);
  color:var(--dou);font-size:15px}
.intro{margin:0 0 6px}
fieldset{border:0;margin:26px 0 0;padding:0}
legend{padding:0}
.num{font:600 12px/1.3 Helvetica,Arial,sans-serif;letter-spacing:.1em;
  color:#9a8f7d;display:block;margin-bottom:3px}
.ttl{font:600 19px/1.35 Georgia,serif;display:block}
.aide{color:var(--dou);font-size:15px;margin:3px 0 12px}
label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--fil);
  border-radius:9px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
  font-size:16.5px;-webkit-tap-highlight-color:transparent}
label:active{background:#faf8f4}
input[type=radio]{appearance:none;width:22px;height:22px;flex:0 0 22px;
  border:2px solid #c3bdb0;border-radius:50%;margin:0;position:relative}
input[type=radio]:checked{border-color:var(--nav)}
input[type=radio]:checked::after{content:"";position:absolute;inset:4px;
  border-radius:50%;background:var(--nav)}
label:has(:checked){border-color:var(--nav);background:#f4f6fb}
input[type=radio]:focus-visible{outline:3px solid #8aa4e0;outline-offset:2px}
textarea{width:100%;border:1.5px solid var(--fil);border-radius:9px;
  padding:13px;font:inherit;font-size:16.5px;min-height:92px;resize:vertical}
.envoi{margin-top:30px;padding-top:22px;border-top:1px solid var(--fil)}
button{width:100%;background:var(--nav);color:#fff;border:0;border-radius:10px;
  padding:17px 20px;font:600 17px/1.2 Helvetica,Arial,sans-serif;cursor:pointer}
button[disabled]{background:#b8b3a8;cursor:default}
.etat{text-align:center;color:var(--dou);font-size:14.5px;margin:11px 0 0}
.pied{color:var(--dou);font-size:14.5px;margin:22px 0 0}
details.mail{border:1px solid var(--fil);border-radius:9px;margin:0 0 10px;background:#faf8f3}
details.mail summary{cursor:pointer;padding:11px 14px;font:600 15px/1.35 Helvetica,Arial,sans-serif;color:var(--nav)}
details.mail .meta{padding:0 14px 6px;color:var(--dou);font:400 13px/1.45 Helvetica,Arial,sans-serif}
details.mail .txt{white-space:pre-wrap;margin:0;padding:4px 14px 14px;font:400 15px/1.55 Helvetica,Arial,sans-serif;overflow-wrap:anywhere}
.ctx{margin:4px 0 8px;font-size:15.5px}
.pq{margin:0 0 12px;font-size:15.5px;background:#f4f6fb;border-left:3px solid var(--nav);padding:9px 12px;border-radius:0 7px 7px 0}
.pq b{font:600 13px/1.3 Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--nav);display:block;margin-bottom:2px}
.choix-t{font:600 13px/1.3 Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#9a8f7d;margin:16px 0 8px}
label .eff{display:block;color:var(--dou);font-size:14px;margin-top:2px}
.bloque{background:#fff4e5;border:1px solid #f0d9b5;border-radius:9px;padding:14px;margin-top:16px}
@media (prefers-color-scheme:dark){
  :root{--pap:#14181f;--enc:#e9e7e1;--dou:#99a0b0;--fil:#2d3341;--nav:#7f9fe0}
  body{background:var(--pap);color:var(--enc)}
  main{background:#1a1f28;border-color:var(--fil)}
  label:has(:checked){background:#20283a}
  .pq{background:#1d2433}
  textarea{background:#141920;color:var(--enc)}
  button{color:#101520}
  .sub{border-bottom-color:var(--enc)}
  details.mail{background:#141920}
}
</style></head><body>
<main>
  <p class="mq">BAHIA MALA</p>
  <p class="sub">Sous chaque question : le fil complet des mails et ce qu&#x27;on propose, en entier. Lis, puis coche.</p>
  <p class="intro">Bonjour Emilie, tape une réponse par question,
     puis le bouton en bas. Un seul message partira, avec tout dedans.</p>
  <form id="f"></form>
  <div class="envoi">
    <button id="go" type="button" disabled>Envoyer mes réponses</button>
    <p class="etat" id="etat"></p>
  </div>
  <p class="pied">Rien ne sera publié sans que tu l'aies validé.</p>
</main>

    fs.appendChild(t);
  } else {
    if (q.mails && q.mails.length) {
      const ct = document.createElement('p'); ct.className = 'choix-t';
      ct.textContent = 'Ta décision'; fs.appendChild(ct);
    }
    q.options.forEach(o => {
      const opt = typeof o === 'string' ? o : o.label;
      const l = document.createElement('label');
      const r = document.createElement('input');
      r.type = 'radio'; r.name = 'q' + i; r.value = opt;
      if (rep['q' + i] === opt) r.checked = true;
      r.onchange = () => { rep['q' + i] = opt; garde(); };
      const s = document.createElement('span'); s.textContent = opt;
      if (o.effet) {
        const ef = document.createElement('span'); ef.className = 'eff';
        ef.textContent = '→ ' + o.effet; s.appendChild(ef);
      }
      l.append(r, s); fs.appendChild(l);
    });
    if (q.autre) {
      const t2 = document.createElement('textarea');
      t2.name = 'q' + i + 'a'; t2.placeholder = q.autre;
      t2.style.marginTop = '4px'; t2.style.minHeight = '72px';
      t2.value = rep['q' + i + 'a'] || '';
      t2.oninput = () => { rep['q' + i + 'a'] = t2.value.trim(); garde(); };
      fs.appendChild(t2);
    }
  }
  f.appendChild(fs);
});

function garde() {
  try { localStorage.setItem(CLE, JSON.stringify(rep)); } catch (e) {}
  const n = QS.filter((q, i) => rep['q' + i] || rep['q' + i + 'a']).length;
  go.disabled = n === 0;
  etat.textContent = n === QS.length
    ? 'Toutes les réponses sont là.'
    : n + ' réponse' + (n > 1 ? 's' : '') + ' sur ' + QS.length +
      '. Tu peux envoyer même si tout n\'est pas rempli.';
}
garde();

go.onclick = () => {
  const lignes = QS.map((q, i) =>
    'Q' + (i + 1) + ' — ' + q.titre + '\n' +
    '   ' + (rep['q' + i] || '(pas de réponse)') +
    (rep['q' + i + 'a'] ? '\n   ' + rep['q' + i + 'a'] : ''));
  const corps = lignes.join('\n\n') + '\n\n— Envoyé depuis la page de questions Bahia Mala';
  location.href = 'mailto:' + DEST + '?subject=' +
    encodeURIComponent(SUJET) + '&body=' + encodeURIComponent(corps);
  etat.textContent = "Ton application mail s'ouvre. Il ne reste qu'à envoyer.";
};
})();
</script></body></html>
